# ENTRUST 아이폰 체험 앱 3개(.ipa) 만들기 — GitHub 의 클라우드 맥에서 빌드(서명 없음).
#   ENTRUST(관객) · 티켓24(가상 예매처) · ENTRUST 관리자(공연 장소 · 시간 설정 + 검표)
# 결과물: 이 실행 화면 아래 'Artifacts' 의 EntrustApps-ipa → 윈도우 PC 의 Sideloadly 로 무료 애플 ID 서명 · 아이폰 설치.
# 비밀값 · 인증서는 쓰지 않는다(서명은 사용자 PC 에서).
name: iOS 체험 앱 빌드
on:
  workflow_dispatch:
  push:
    branches: [app/dev, main, "claude/**"]
    paths:
      - 'packaging/ios/EntrustApp/**'
      - '.github/workflows/ios-app.yml'
permissions:
  contents: read
jobs:
  build:
    # macos-14 는 2026-11-02 폐기, arm64 맥(macos-15·26)은 GitHub 용량 부족으로 배정 실패(2026-11-25) → 인텔 맥
    runs-on: macos-15-intel
    timeout-minutes: 40
    defaults:
      run:
        working-directory: packaging/ios/EntrustApp
    steps:
      - uses: actions/checkout@v4
      - name: 도구 설치(XcodeGen)
        run: brew install xcodegen
      - name: 앱 아이콘 만들기
        run: python3 make_icon.py
      - name: Xcode 프로젝트 만들기
        run: xcodegen generate
      - name: 빌드(서명 없음)
        run: |
          set -o pipefail
          for T in EntrustApp Ticket24 EntrustAdmin; do
            echo "::group::$T"
            xcodebuild -project EntrustApp.xcodeproj -target "$T" -configuration Release -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
              | grep -E "error:|warning: unre|BUILD|\*\*" || true
            test -d "build/Release-iphoneos/$T.app" || { echo "::error::$T 빌드 실패 — 위 error: 줄을 확인"; exit 1; }
            echo "::endgroup::"
          done
      - name: .ipa 로 묶기
        run: |
          mkdir -p out
          for T in EntrustApp Ticket24 EntrustAdmin; do
            rm -rf Payload && mkdir Payload
            cp -R "build/Release-iphoneos/$T.app" Payload/
            zip -qry "out/$T-unsigned.ipa" Payload
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: EntrustApps-ipa
          path: packaging/ios/EntrustApp/out/*.ipa
          retention-days: 30
