# 임시 진단용 — 어떤 실행기가 배정되는지 확인 후 삭제
name: runner probe
on:
  push:
    paths: ['.github/workflows/runner-probe.yml']
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: uname -a; sw_vers 2>/dev/null || true; xcodebuild -version 2>/dev/null || true
